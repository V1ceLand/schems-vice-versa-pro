# Витрина «Пар»: отдача статики, ничего проксировать не нужно.
# Подставьте своё имя в server_name, если у сайта есть домен.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/pairs-demo;
    index index.html;

    charset utf-8;

    # Страница целиком статическая: несуществующий путь — это 404, а не SPA.
    location / {
        try_files $uri $uri/ =404;
    }

    # Разметка может меняться при каждой правке текста — не кэшируем.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Стили, скрипты и иконки версионируются вручную, но живут долго.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # README и служебные файлы наружу не отдаём.
    location ~ /\. { deny all; }
    location ~* \.(md|sh|conf)$ { deny all; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/pairs-demo.access.log;
    error_log  /var/log/nginx/pairs-demo.error.log;
}
